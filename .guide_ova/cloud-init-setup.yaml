# Run commands to install tools
runcmd:
  # Verify GPG key
  - "mkdir -p /usr/share/keyrings"
  
  # Install Terraform
  - "apt-get update && apt-get install -y terraform"
  
  # Install Ansible
  - "apt-get install -y ansible"
  
  # Configure git (default config for students)
  - "git config --system user.name 'Student 3IAC1'"
  - "git config --system user.email 'student@3iac1.local'"
  
  # Create project directory and clone repo
  - "mkdir -p /home/student/projects"
  - "cd /home/student/projects && git clone https://github.com/mentiforjastudio-svg/3IAC1-lab-starter.git || echo 'Clone failed - check URL'"
  
  # Verify installation
  - "echo '=== Environment Check ===' >> /var/log/3iac1-setup.log"
  - "git --version >> /var/log/3iac1-setup.log"
  - "terraform --version >> /var/log/3iac1-setup.log"
  - "ansible --version >> /var/log/3iac1-setup.log"

# Create final message
final_message: |
  ========================================
  3IAC1 Lab Environment Ready!
  ========================================
  
  Project location:
    /home/student/projects/3IAC1-lab-starter
  
  Next steps:
    1. cd /home/student/projects/3IAC1-lab-starter
    2. bash scripts/check-env.sh
    3. cd terraform/jour1 && terraform init
  
  Check setup log:
    tail -f /var/log/3iac1-setup.log
  
  ========================================
