---
# =============================================================================
# Playbook 01 — Installation de Docker via Ansible
# Objectif : préparer l'OVA pour exécuter des conteneurs Docker
# =============================================================================

- name: "Installation de Docker"
  hosts: localhost
  become: yes

  tasks:

    - name: "Installer Docker et ses dépendances"
      apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: yes
      # Note : docker-compose-plugin n'est pas dans les dépôts Ubuntu 22.04 par défaut.
      # Ce TP utilise Terraform (provider kreuzwerker/docker) pour gérer les conteneurs —
      # docker-compose n'est pas nécessaire.

    - name: "Démarrer et activer le service Docker"
      service:
        name: docker
        state: started
        enabled: yes

    - name: "Ajouter l'utilisateur courant au groupe docker"
      user:
        name: "{{ ansible_env.USER }}"
        groups: docker
        append: yes

    - name: "Vérifier que Docker est fonctionnel"
      command: docker --version
      register: docker_version
      changed_when: false

    - name: "Afficher la version de Docker"
      debug:
        msg: "Docker installé : {{ docker_version.stdout }}"
