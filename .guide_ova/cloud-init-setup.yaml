#cloud-config
# Ubuntu 22.04 cloud-init provisioning for 3IAC1 Lab
# This file configures the VM automatically on first boot

hostname: 3iac1-lab
fqdn: 3iac1-lab.local

# Update system packages
package_update: true
package_upgrade: true

# Install required packages
packages:
  - git
  - curl
  - wget
  - gnupg
  - lsb-release
  - ca-certificates

# Add HashiCorp repository
apt:
  sources:
    hashicorp:
      source: deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com jammy main
