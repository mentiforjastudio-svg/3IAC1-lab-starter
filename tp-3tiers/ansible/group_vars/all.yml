---
# =============================================================================
# group_vars/all.yml — Variables partagées
# Les secrets sont chiffrés avec Ansible Vault.
# =============================================================================

# ── Application ───────────────────────────────────────────────────────────────
app_name: "tp-3tiers"
deploy_environment: "dev"

# ── Base de données ───────────────────────────────────────────────────────────
db_name: "appdb"
db_user: "appuser"

# ⚠️  CONTEXTE TP — SÉCURITÉ ALLÉGÉE
# En production, cette valeur DOIT être chiffrée avec ansible-vault :
#   ansible-vault encrypt_string 'MonMotDePasseSecret42' --name 'db_password' --vault-password-file .vault_pass
# et le résultat remplace la ligne ci-dessous (tag !vault |).
# Pour ce TP, la valeur est en clair pour simplifier l'exécution et la vérification.
db_password: "MonMotDePasseSecret42"

# ── Nginx ─────────────────────────────────────────────────────────────────────
nginx_port: 80
flask_upstream: "flask_app:5000"

# ── Docker ────────────────────────────────────────────────────────────────────
docker_packages:
  - docker.io
  - docker-compose-plugin
  - python3-docker
