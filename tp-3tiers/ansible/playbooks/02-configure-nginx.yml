---
# =============================================================================
# Playbook 02 — Configuration Nginx (reverse proxy sécurisé)
# Objectif : déployer la config Nginx avec les en-têtes de sécurité
# Prérequis : terraform apply exécuté (étape 2), conteneur nginx démarré
#
# Pourquoi docker cp et pas template directement dans /etc/nginx/ ?
#   Nginx tourne dans un conteneur Docker — son système de fichiers est isolé
#   de l'hôte. Le module 'template' écrit sur l'hôte, pas dans le conteneur.
#   La commande 'docker cp' copie le fichier généré vers le bon endroit.
# =============================================================================

- name: "Configuration de Nginx"
  hosts: localhost
  become: no

  tasks:

    - name: "Supprimer la configuration Nginx par défaut dans le conteneur"
      command: docker exec nginx rm -f /etc/nginx/conf.d/default.conf
      # L'image nginx:alpine inclut un default.conf qui écoute aussi sur le port 80.
      # S'il reste, nginx charge deux server{} sur le même port → conflit.
      changed_when: true

    - name: "Générer la config Nginx depuis le template (fichier temporaire sur l'hôte)"
      template:
        src: "../templates/nginx.conf.j2"
        dest: "/tmp/nginx-app.conf"
        mode: "0644"
      # Le module 'template' substitue les variables Jinja2 ({{ flask_upstream }}, etc.)
      # et écrit le fichier résultant dans /tmp/ sur l'hôte.

    - name: "Copier la config dans le conteneur Nginx"
      command: docker cp /tmp/nginx-app.conf nginx:/etc/nginx/conf.d/app.conf
      # docker cp transfère le fichier depuis l'hôte vers le conteneur.
      # Équivalent à 'scp' mais pour les conteneurs Docker.

    - name: "Tester la configuration Nginx (dans le conteneur)"
      command: docker exec nginx nginx -t
      register: nginx_test
      changed_when: false

    - name: "Afficher le résultat du test"
      debug:
        msg: "{{ nginx_test.stdout_lines }}"

    - name: "Recharger Nginx pour appliquer la nouvelle configuration"
      command: docker exec nginx nginx -s reload
      # 'nginx -s reload' relit la config sans couper les connexions en cours.
